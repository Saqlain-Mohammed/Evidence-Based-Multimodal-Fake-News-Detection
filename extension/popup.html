<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veritas</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head><body><header><strong>veritas.</strong><span>CONTENT VERIFICATION</span></header><h1>Take a closer look.</h1><p>Send selected text or media to your local research engine.</p><label for="server">Local server</label><input id="server" type="url" value="http://127.0.0.1:8000"><label for="token">Access token (protected servers)</label><input id="token" type="password" autocomplete="off"><label for="text">Text to examine</label><textarea id="text" rows="7" placeholder="Paste a passage or capture the current page."></textarea><details><summary>Compare with a reference</summary><label for="reference">Original passage</label><textarea id="reference" rows="3"></textarea></details><button id="capture" class="secondary">Use current page text</button><label for="file">Image or video file</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime,video/x-msvideo"><p id="media-source"></p><label class="check"><input id="evidence" type="checkbox">Find related reporting online</label><button id="analyze">Analyze content</button><div id="result" role="status"></div><a id="studio" href="http://127.0.0.1:8000" target="_blank" rel="noopener">Open verification studio</a><p class="foot">Scores are research signals. Content is sent only when you choose Analyze.</p></body></html>
