name: Validate research workspace
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install fastapi uvicorn python-multipart numpy pandas scipy scikit-learn==1.9.1 joblib pillow requests beautifulsoup4 soundfile pypdf pytest httpx opencv-python-headless imageio-ffmpeg
      - name: Check model and API contracts
        run: python -m pytest tests -q
